<!DOCTYPE html><html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Argumentum</title><style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    background: #030303;
    color: #fff;
    font-family: Arial, Helvetica, sans-serif;
}

/* =========================================================
   WORKSPACE
========================================================= */

#viewport {
    position: fixed;
    inset: 0;
    overflow: hidden;

    cursor: grab;

    background:
        radial-gradient(circle at 50% 50%,
            rgba(255,255,255,.025),
            transparent 38%),
        radial-gradient(circle at 50% 50%,
            rgba(40,40,40,.12) 1px,
            transparent 1px);

    background-size:
        auto,
        30px 30px;
}

#viewport.dragging {
    cursor: grabbing;
}

/* =========================================================
   GRAPH
========================================================= */

#graph {
    position: absolute;

    width: 6000px;
    height: 5000px;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%)
        scale(1);

    transform-origin: center;
}

/* =========================================================
   SVG CONNECTIONS
========================================================= */

#connections {
    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    pointer-events: none;

    overflow: visible;
}

.connection {
    fill: none;

    stroke: rgba(255,255,255,.16);

    stroke-width: 2;

    stroke-linecap: round;

    stroke-dasharray: 1000;
    stroke-dashoffset: 1000;

    animation:
        connectionAppear .8s ease forwards;
}

.connection-glow {
    fill: none;

    stroke: rgba(255,255,255,.04);

    stroke-width: 10;

    stroke-linecap: round;

    filter: blur(5px);

    stroke-dasharray: 1000;
    stroke-dashoffset: 1000;

    animation:
        connectionAppear .8s ease forwards;
}

@keyframes connectionAppear {

    to {
        stroke-dashoffset: 0;
    }
}

/* =========================================================
   NODE
========================================================= */

.node {
    position: absolute;

    width: 270px;

    transform:
        translate(-50%, -50%)
        scale(.82);

    opacity: 0;

    animation:
        nodeAppear .5s cubic-bezier(.2,.8,.2,1)
        forwards;

    z-index: 5;
}

@keyframes nodeAppear {

    from {
        opacity: 0;

        transform:
            translate(-50%, -50%)
            scale(.82);
    }

    to {
        opacity: 1;

        transform:
            translate(-50%, -50%)
            scale(1);
    }
}

/* =========================================================
   NODE BUTTON
========================================================= */

.node-button {

    width: 100%;

    position: relative;

    border: 1px solid rgba(255,255,255,.10);

    background:
        linear-gradient(
            145deg,
            rgba(24,24,24,.98),
            rgba(8,8,8,.98)
        );

    color: white;

    border-radius: 16px;

    padding: 18px;

    cursor: pointer;

    text-align: left;

    box-shadow:
        0 18px 50px rgba(0,0,0,.55),
        inset 0 1px 0 rgba(255,255,255,.04);

    transition:
        transform .25s ease,
        border-color .25s ease,
        box-shadow .25s ease;
}

.node-button:hover {

    transform: translateY(-4px);

    border-color:
        color-mix(
            in srgb,
            var(--node-color) 60%,
            white 10%
        );

    box-shadow:
        0 22px 65px rgba(0,0,0,.72),
        0 0 35px var(--node-glow);
}

/* =========================================================
   ACTIVE NODE
========================================================= */

.node.opened .node-button {

    border-color:
        var(--node-color);

    box-shadow:
        0 20px 65px rgba(0,0,0,.7),
        0 0 28px var(--node-glow);
}

/* =========================================================
   TYPE
========================================================= */

.type {

    display: flex;

    align-items: center;

    gap: 8px;

    margin-bottom: 10px;

    color: #777;

    font-size: 9px;

    letter-spacing: 1.8px;

    text-transform: uppercase;
}

.dot {

    width: 8px;
    height: 8px;

    flex-shrink: 0;

    border-radius: 50%;

    background:
        var(--node-color);

    box-shadow:
        0 0 13px var(--node-color);
}

/* =========================================================
   TEXT
========================================================= */

.text {

    display: block;

    color: #eee;

    font-family: Georgia, serif;

    font-size: 16px;

    line-height: 1.55;
}

/* =========================================================
   OPEN BUTTON
========================================================= */

.expand {

    display: flex;

    align-items: center;

    justify-content: space-between;

    margin-top: 14px;

    padding-top: 11px;

    border-top:
        1px solid rgba(255,255,255,.07);

    color: #666;

    font-size: 10px;

    letter-spacing: .5px;

    transition: .25s;
}

.node-button:hover .expand {

    color: #ccc;
}

.arrow {

    transition: transform .25s;
}

.node.opened .arrow {

    transform:
        rotate(90deg);
}

/* =========================================================
   COLORS
========================================================= */

.premise {

    --node-color: #f0f0f0;
    --node-glow: rgba(255,255,255,.16);
}

.argument {

    --node-color: #3987ff;
    --node-glow: rgba(57,135,255,.22);
}

.counter {

    --node-color: #a52852;
    --node-glow: rgba(165,40,82,.24);
}

.response {

    --node-color: #35c979;
    --node-glow: rgba(53,201,121,.22);
}

.idea {

    --node-color: #d8aa35;
    --node-glow: rgba(216,170,53,.22);
}

.conclusion {

    --node-color: #914cff;
    --node-glow: rgba(145,76,255,.22);
}

.example {

    --node-color: #00a9b7;
    --node-glow: rgba(0,169,183,.22);
}

.question {

    --node-color: #ff7b35;
    --node-glow: rgba(255,123,53,.22);
}

/* =========================================================
   SIDEBAR
========================================================= */

.sidebar {

    position: fixed;

    left: 0;
    top: 0;
    bottom: 0;

.logo span {

.sidebar-title {

    color: #555;

    font-size: 9px;

    letter-spacing: 2px;

.topic {

    gap: 11px;

}

.topic-dot {

    width: 8px;
    height: 8px;

    border-radius: 50%;

    box-shadow:

.add-topic {

    margin-top: 12px;

    padding: 11px;

    border:

    border-radius: 9px;

    background: transparent;

    color: #666;

    cursor: pointer;

    font-size: 11px;

    transition: .2s;
}

.add-topic:hover {

    border-color: #666;

    color: #aaa;
}

/* =========================================================
   TITLE
========================================================= */

.title {

    position: fixed;

    top: 22px;
    left: 270px;

    z-index: 100;

    pointer-events: none;
}

.title strong {

    display: block;

    font-size: 11px;

    letter-spacing: 3px;

    font-weight: 500;

.title span {

    display: block;

    margin-top: 5px;

    color: #444;

    font-size: 8px;

    letter-spacing: 1.5px;

/* =========================================================
   LEGEND
========================================================= */

.legend {

    position: fixed;

    left: 270px;
    bottom: 22px;

    z-index: 100;

    display: flex;

    gap: 15px;

    padding: 9px 13px;

    border:

    background:
        rgba(8,8,8,.75);

    backdrop-filter: blur(10px);

    color: #777;

    font-size: 9px;
}

.legend-item {

    display: flex;

    align-items: center;

    gap: 5px;
}

.legend-dot {

    width: 6px;
    height: 6px;

    border-radius: 50%;
}

/* =========================================================
   CONTROLS
========================================================= */

.controls {

    position: fixed;

    right: 20px;
    bottom: 20px;

    z-index: 100;

    display: flex;

    gap: 6px;
}

.control {

    width: 42px;
    height: 42px;

    border:
        1px solid #222;

    border-radius: 11px;

    background:
        rgba(12,12,12,.92);

    color: #999;

    font-size: 17px;

    backdrop-filter: blur(12px);

    transition: .2s;
}

.control:hover {

    border-color: #555;

    color: white;
}

/* =========================================================
   MOBILE SIDEBAR
========================================================= */

.sidebar-toggle {

    display: none;

    position: fixed;

    left: 15px;
    top: 15px;

    border-radius: 10px;

    background:

    color: white;

}

@media(max-width:700px) {

    .sidebar {

        width: 230px;

    }

    }

    .legend {

    }

    .node {

    }

    .text {

        font-size: 14px;

/* =========================================================
   EMPTY MESSAGE
========================================================= */

.center-hint {

    position: fixed;

    left: calc(50% + 120px);
    top: 50%;

    transform:
        translate(-50%, -50%);

    color: #222;

    font-size: 10px;

    letter-spacing: 2px;

    text-transform: uppercase;

    pointer-events: none;

    opacity: .6;
}

/* =========================================================
   GRAPH STATE
========================================================= */

const graph =
    document.getElementById("graph");

const svg =
    document.getElementById("connections");

const viewport =
    document.getElementById("viewport");

let currentData = TOPICS.euro;

let nodeId = 0;

let scale = 1;

let offsetX = 0;

let offsetY = 0;

let dragging = false;

let lastX = 0;

let lastY = 0;


/* =========================================================
   CLEAR GRAPH
========================================================= */

function clearGraph() {

    graph
        .querySelectorAll(".node")
        .forEach(
            node => node.remove()
        );

    svg.innerHTML = "";

    nodeId = 0;

}


/* =========================================================
   POSITIONING
========================================================= */

const LEVEL_DISTANCE = 390;

const HORIZONTAL_DISTANCE = 380;


/*
   Poziționează copiii în jurul părintelui.
*/

function positionChildren(
    parent,
    children
) {

    const count =
        children.length;

    children.forEach(
        (child, index) => {

            const center =
                (count - 1) / 2;

            const horizontal =
                (index - center)
                * HORIZONTAL_DISTANCE;

            child._x =
                parent._x +
                horizontal;

            child._y =
                parent._y +
                LEVEL_DISTANCE;

        }
    );

}


/* =========================================================
   CREATE NODE
========================================================= */

function createNode(
    data,
    parent = null
) {

    if (
        data._created
    )
        return;

    data._created = true;

    data._id =
        nodeId++;

    const element =
        document.createElement("div");

    element.className =
        `node ${data.color || "premise"}`;

    element.id =
        `node-${data._id}`;

    element.style.left =
        `${data._x}px`;

    element.style.top =
        `${data._y}px`;

    const hasChildren =
        data.children &&
        data.children.length > 0;

    element.innerHTML = `

        <button class="node-button">

            <span class="type">

                <span class="dot"></span>

                ${escapeHTML(
                    data.type ||
                    "Idee"
                )}

            </span>

            <span class="text">

                ${escapeHTML(
                    data.text ||
                    ""
                )}

            </span>

            ${
                hasChildren
                ?
                `
                <span class="expand">

                    <span>
                        ${
                            data._opened
                            ? "Închide ramura"
                            : "Deschide ramura"
                        }
                    </span>

                    <span class="arrow">
                        →
                    </span>

                </span>
                `
                :
                ""
            }

        </button>

    `;

    graph.appendChild(element);


    /*
       Click pe nod
    */

    if (hasChildren) {

        const button =
            element.querySelector(
                ".node-button"
            );

        button.onclick =
            function(event) {

                event.stopPropagation();

                toggleChildren(
                    data,
                    element
                );

            };

    }

    /*
       Mic efect pentru apariție
    */

    setTimeout(
        () => {

            element.style.opacity = "1";

        },
        20
    );

}


/* =========================================================
   TOGGLE CHILDREN
========================================================= */

function toggleChildren(
    parent,
    parentElement
) {

    if (
        parent._opened
    ) {

        closeChildren(
            parent,
            parentElement
        );

        return;

    }

    openChildren(
        parent,
        parentElement
    );

}


/* =========================================================
   OPEN CHILDREN
========================================================= */

function openChildren(
    parent,
    parentElement
) {

    if (
        !parent.children ||
        !parent.children.length
    )
        return;


    parent._opened = true;

    parentElement.classList.add(
        "opened"
    );


    const expand =
        parentElement.querySelector(
            ".expand span:first-child"
        );

    if (expand)
        expand.textContent =
            "Închide ramura";


    positionChildren(
        parent,
        parent.children
    );


    parent.children.forEach(
        (child, index) => {

            createNode(
                child,
                parent
            );

            drawConnection(
                parent,
                child
            );

        }
    );

}


/* =========================================================
   CLOSE CHILDREN
========================================================= */

function closeChildren(
    parent,
    parentElement
) {

    parent._opened = false;

    parentElement.classList.remove(
        "opened"
    );


    const expand =
        parentElement.querySelector(
            ".expand span:first-child"
        );

    if (expand)
        expand.textContent =
            "Deschide ramura";


    /*
       Ascundem copiii și descendenții.
    */

    if (
        !parent.children
    )
        return;


    parent.children.forEach(
        child => {

            hideBranch(
                child
            );

        }
    );


    rebuildConnections();

}


/* =========================================================
   HIDE BRANCH
========================================================= */

function hideBranch(
    node
) {

    const element =
        document.getElementById(
            `node-${node._id}`
        );

    if (element) {

        element.style.opacity = "0";

        element.style.pointerEvents =
            "none";

        setTimeout(
            () => {

                if (element.parentNode)
                    element.remove();

            },
            250
        );

    }

    if (node.children) {

        node.children.forEach(
            child => {

                hideBranch(
                    child
                );

            }
        );

    }

    node._opened = false;

    node._created = false;

}


/* =========================================================
   CONNECTION
========================================================= */

function drawConnection(
    parent,
    child
) {

    const x1 =
        parent._x;

    const y1 =
        parent._y + 70;


    const x2 =
        child._x;

    const y2 =
        child._y - 70;


    const curve =
        Math.max(
            100,
            Math.abs(x2 - x1) * .35
        );


    const path = `

        M ${x1} ${y1}

        C
        ${x1} ${y1 + curve},
        ${x2} ${y2 - curve},
        ${x2} ${y2}

    `;


    const glow =
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            "path"
        );

    glow.setAttribute(
        "d",
        path
    );

    glow.setAttribute(
        "class",
        "connection-glow"
    );


    const line =
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            "path"
        );

    line.setAttribute(
        "d",
        path
    );

    line.setAttribute(
        "class",
        "connection"
    );


    svg.appendChild(
        glow
    );

    svg.appendChild(
        line
    );

}


/* =========================================================
   REBUILD CONNECTIONS
========================================================= */

function rebuildConnections() {

    svg.innerHTML = "";

    /*
       Recursiv reconstruim doar
       ramurile deschise.
    */

    function walk(node) {

        if (
            !node._opened ||
            !node.children
        )
            return;

        node.children.forEach(
            child => {

                if (
                    child._created
                ) {

                    drawConnection(
                        node,
                        child
                    );

                    walk(
                        child
                    );

                }

            }
        );

    }

    walk(
        currentData
    );

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(
    text
) {

    return String(text)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* =========================================================
   LOAD TOPIC
========================================================= */

function loadTopic(
    topic,
    button
) {

    currentData =
        TOPICS[topic];

    document
        .querySelectorAll(".topic")
        .forEach(
            el =>
                el.classList.remove(
                    "active"
                )
        );

    button.classList.add(
        "active"
    );


    document
        .getElementById(
            "current-topic"
        )
        .textContent =
            currentData.title;


    resetData(
        currentData
    );


    clearGraph();


    /*
       Premisa este întotdeauna
       în centrul graficului.
    */

    currentData._x =
        3000;

    currentData._y =
        2400;


    createNode(
        currentData
    );


    centerGraph();

}


/* =========================================================
   RESET DATA
========================================================= */

function resetData(
    node
) {

    node._created = false;

    node._opened = false;

    if (node.children) {

        node.children.forEach(
            child =>
                resetData(
                    child
                )
        );

    }

}

            {

            }

        ]

    };


    const button =

        );

            loadTopic(

    document

        .before(

        );


    loadTopic(

    );

/* =========================================================
   PAN
========================================================= */

viewport.addEventListener(
    "mousedown",
    event => {

        if (
            event.target.closest(".node")
        )
            return;

        dragging = true;

        lastX =
            event.clientX;

        lastY =
            event.clientY;

        viewport.classList.add(
            "dragging"
        );

    }
);


window.addEventListener(
    "mousemove",
    event => {

        if (!dragging)
            return;


        offsetX +=
            event.clientX -
            lastX;

        offsetY +=
            event.clientY -
            lastY;


        lastX =
            event.clientX;

        lastY =
            event.clientY;


        updateGraph();

    }
);


window.addEventListener(
    "mouseup",
    () => {

        dragging = false;

        viewport.classList.remove(
            "dragging"
        );

    }
);


/* =========================================================
   TOUCH
========================================================= */

let touchX = 0;

let touchY = 0;

viewport.addEventListener(
    "touchstart",
    event => {

        if (
            event.target.closest(".node")
        )
            return;

        touchX =
            event.touches[0].clientX;

        touchY =
            event.touches[0].clientY;

    },
    {passive:true}
);


viewport.addEventListener(
    "touchmove",
    event => {

        if (
            event.target.closest(".node")
        )
            return;

        const x =
            event.touches[0].clientX;

        const y =
            event.touches[0].clientY;


        offsetX +=
            x - touchX;

        offsetY +=
            y - touchY;


        touchX = x;

        touchY = y;


        updateGraph();

    },
    {passive:true}
);


/* =========================================================
   ZOOM
========================================================= */

function updateGraph() {

    graph.style.transform = `

        translate(
            calc(-50% + ${offsetX}px),
            calc(-50% + ${offsetY}px)
        )

        scale(${scale})

    `;

}


function zoomIn() {

    scale =
        Math.min(
            2.2,
            scale + .12
        );

    updateGraph();

}


function zoomOut() {

    scale =
        Math.max(
            .35,
            scale - .12
        );

    updateGraph();

}


function centerGraph() {

    scale = 1;

    offsetX = 0;

    offsetY = 0;

    updateGraph();

}


function resetGraph() {

    resetData(
        currentData
    );

    clearGraph();

    currentData._x =
        3000;

    currentData._y =
        2400;

    createNode(
        currentData
    );

    centerGraph();

}

        )

        );

}
